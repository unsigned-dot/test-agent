[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-api-client"
version = "1.0.0"
description = "Client API Python passant par Tor (SOCKS5h) avec retry borné et renouvellement de circuit (NEWNYM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests[socks]>=2.32,<3",
    "stem>=1.8.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tor-api-client = "tor_api_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
