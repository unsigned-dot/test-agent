# Rotation des journaux du robot. Le robot fait déjà tourner bot.log chaque jour à minuit UTC
# (bot.log.AAAA-MM-JJ) ; logrotate COMPRESSE ces fichiers et ne supprime rien (archivage complet).
/opt/btc_scalp/var/log/bot.log.????-??-?? {
    daily
    missingok
    notifempty
    nocreate
    compress
    rotate 100000
    maxage 100000
    su btcbot btcbot
}
